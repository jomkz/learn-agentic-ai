apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: embedding-cluster
  namespace: ai-platform
  labels:
    app: embedding-cluster
    component: ray
spec:
  rayVersion: "2.9.0"
  enableInTreeAutoscaling: false

  headGroupSpec:
    replicas: 1
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "0"
    template:
      metadata:
        labels:
          app: embedding-cluster
          role: head
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.9.0-py311
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            resources:
              requests:
                cpu: "2"
                memory: 6Gi
              limits:
                cpu: "4"
                memory: 8Gi
            env:
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: huggingface-credentials
                    key: token
            volumeMounts:
              - name: model-cache
                mountPath: /root/.cache/huggingface
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: ray-model-cache-pvc

  workerGroupSpecs:
    - groupName: gpu-workers
      replicas: 3
      minReplicas: 1
      maxReplicas: 6
      rayStartParams:
        num-cpus: "4"
        num-gpus: "1"
      template:
        metadata:
          labels:
            app: embedding-cluster
            role: worker
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.9.0-py311-gpu
              resources:
                requests:
                  cpu: "2"
                  memory: 6Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "4"
                  memory: 8Gi
                  nvidia.com/gpu: "1"
              env:
                - name: HUGGING_FACE_HUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: huggingface-credentials
                      key: token
              volumeMounts:
                - name: model-cache
                  mountPath: /root/.cache/huggingface
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: ray-model-cache-pvc
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
