name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      optional_phases:
        description: Install and check heavyweight optional phase dependencies
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_PYTHON: '3.12'

jobs:
  test:
    name: Lint, types, tests, and local capstone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
      - run: uv sync --locked --extra agents --extra pipelines --extra evaluation
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --cov=mobility_ai --cov-fail-under=90 --cov-report=xml -q
      - name: Exercise documented capstone commands
        run: |
          uv run --no-sync python -m mobility_ai.capstone.app ingest --corpus projects/capstone/data/corpus --db outputs/capstone.db --provider lexical
          uv run --no-sync python -m mobility_ai.capstone.app ask --db outputs/capstone.db --question "What does pgvector add to PostgreSQL?"
          uv run --no-sync python -m mobility_ai.capstone.app evaluate --db outputs/capstone.db --eval-set evals/data/capstone-questions.jsonl --records outputs/run.jsonl --output outputs/report.json --backend lexical --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            coverage.xml
            outputs/*.json
            outputs/*.jsonl

  installed-package:
    name: Installed package outside the source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
      - run: uv sync --locked --no-dev --no-editable
      - name: Exercise the installed CLI without source-path imports
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -c 'from pathlib import Path; import mobility_ai; assert "site-packages" in Path(mobility_ai.__file__).parts'
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m mobility_ai.capstone.app ingest --corpus "$GITHUB_WORKSPACE/projects/capstone/data/corpus" --db installed-capstone.db --provider lexical
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m mobility_ai.capstone.app ask --db installed-capstone.db --question "What does pgvector add to PostgreSQL?"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m mobility_ai.capstone.app evaluate --db installed-capstone.db --eval-set "$GITHUB_WORKSPACE/evals/data/capstone-questions.jsonl" --records "$GITHUB_WORKSPACE/outputs/installed-run.jsonl" --output "$GITHUB_WORKSPACE/outputs/installed-report.json" --backend lexical --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-package-results
          path: outputs/installed-*.json*

  phase-installs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: langchain
            tests: projects/phase2-langchain
          - extra: agents
            tests: projects/phase5-langgraph projects/phase6-mcp-guardrails
          - extra: pipelines
            tests: projects/phase8-openshift/tests/test_kfp_pipeline.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
      - run: uv sync --locked --extra "${{ matrix.extra }}"
      - run: uv run --no-sync pytest -q ${{ matrix.tests }}

  optional-phase-installs:
    if: github.event_name == 'workflow_dispatch' && inputs.optional_phases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [rag, advanced-rag, llamastack, ml, advanced, evaluation]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.15'
      - run: uv sync --locked --extra "${{ matrix.extra }}"
      - name: Check installed phase integrations without downloading models
        env:
          PHASE_EXTRA: ${{ matrix.extra }}
        run: uv run --no-sync python -m mobility_ai.check_install
