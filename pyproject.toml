[project]
name = "mobility-ai"
version = "0.1.0"
description = "Agentic AI learning path projects — Red Hat Mobility"
requires-python = ">=3.11"
dependencies = [
    # Phase 1: Foundations
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",          # also used as Ollama/vLLM client (OpenAI-compatible)
    "anthropic>=0.30",
    "ollama>=0.3",
    "python-dotenv>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
# Phase 2: LangChain
langchain = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langsmith>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
]

# Phase 3: RAG fundamentals
rag = [
    "docling>=2.0",
    "langchain-chroma>=0.1",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "qdrant-client>=1.11",
    "ragas>=0.2",
    "sentence-transformers>=3.0",
    "unstructured[pdf]>=0.15",
]

# Phase 4: Advanced RAG
advanced-rag = [
    "redis>=5.0",
    "cohere>=5.0",
    "flashrank>=0.2",
    "tiktoken>=0.7",
]

# Phase 5-6: LangGraph + MCP
agents = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "mcp>=1.0",
    "guardrails-ai>=0.5",
]

# Phase 7: LlamaStack
llamastack = [
    "llama-stack>=0.1",
    "llama-stack-client>=0.1",
]

# Phase 8: HuggingFace, fine-tuning, MLOps
ml = [
    "transformers>=4.45",
    "datasets>=3.0",
    "peft>=0.13",
    "trl>=0.12",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "evaluate>=0.4",
    "mlflow>=2.17",
    "kfp>=2.0",
    "ray[data,train,serve]>=2.38",
]

# Phase 9: GraphRAG, knowledge graphs, multi-modal
advanced = [
    "graphrag>=1.0",
    "neo4j>=5.0",
    "networkx>=3.0",
]

# Dev tools (always install)
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "deepeval>=1.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-redis",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "deepeval>=1.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["projects", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
